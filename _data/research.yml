- id: human-ai-decision-making
  title: Human–AI Collaboration in Open-Source Communities
  accent: "#7F77DD"
  image: /assets/images/research-roadmaps/human-ai-open-source.png
  image_alt: >-
    Research roadmap illustrating how developer profiles and social signals
    shape human and AI collaboration decisions in open-source communities.
  image_width: 1672
  image_height: 940
  paragraphs:
    - >-
      Open-source contributors often decide whether and how to collaborate with
      people they do not know. Platforms surface developer profiles,
      contribution histories, and activity summaries that may be used to infer
      a potential collaborator's experience, commitment, or reliability. I
      study these forms of developer information as social signals and ask
      whether making more activity visible actually leads to more effective and
      inclusive collaboration.
    - >-
      Using GitHub Activity Overview as a case, my work shows that greater
      visibility does not necessarily improve collaboration outcomes. The
      information may be overlooked, interpreted inconsistently, or trigger
      behavior that weakens its intended effect. I then compare how humans and
      LLMs interpret the same information, which cues they rely on, and where
      their decisions diverge.
    - >-
      As LLMs assume more roles in software development and community
      coordination, developer information may be created, reviewed, and acted
      on by both people and AI. My long-term goal is to design and evaluate
      better profiles, summaries, and visualizations for human–human,
      human–AI, and AI–AI collaboration. I am particularly interested in how
      information design can improve contributor success, lower barriers for
      newcomers, strengthen trust, and support sustainable open-source
      communities.
  related_publication_ids:
