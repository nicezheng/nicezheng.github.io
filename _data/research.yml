- id: ai-and-society
  title: AI & Society
  accent: "#6750A4"
  framing: Human–AI collaboration and pluralistic value representation
  introduction: >-
    I study how AI understands and participates in social life: human–AI
    collaboration at the micro level, and the representation of diverse
    societies and values at the macro level.
  topics:
    - id: human-ai-decision-making
      level: Micro level
      title: Human–AI Collaboration
      paragraphs:
        - >-
          How can people and AI build trust, coordinate contributions, and
          sustain collective action? I work on the mechanisms and
          infrastructures that allow people and AI agents to collaborate as
          capable, accountable participants in open-source communities and
          other collective settings.
        - >-
          I am working on how social information is represented, interpreted,
          and acted on, and on interfaces and feedback mechanisms that improve
          mutual understanding and coordination. The goal is to make human–AI
          collaboration more trustworthy, inclusive, and sustainable as AI
          agents take on increasingly autonomous roles.
      image: /assets/images/research-roadmaps/human-ai-open-source.png
      image_alt: >-
        Research roadmap connecting social information, human and AI
        decision-making, and collaborative system design in open-source communities.
      image_width: 1672
      image_height: 940
    - id: llm-values-ai-orientalism
      level: Macro level
      title: AI Orientalism and Pluralistic AI
      paragraphs:
        - >-
          How can AI represent a pluralistic world without reducing people
          and societies to stereotypes? I study AI Orientalism and other
          geopolitical biases in how models represent human values, and
          investigate how these distortions arise across data, languages,
          and model behavior.
        - >-
          I am working toward pluralistic AI through culturally grounded
          evaluation, more diverse sources of evidence, and feedback from
          the communities being represented. The goal is to improve how AI
          learns, expresses, and adapts to diverse and sometimes conflicting
          perspectives, while preserving differences within as well as
          across societies.
      image: /assets/images/research-roadmaps/ai-orientalism-pluralistic-ai.png
      image_alt: >-
        Research roadmap mapping diverse human values, diagnosing AI
        Orientalism, and improving pluralistic AI through community feedback
        and ongoing evaluation, with a world map as geographic context.
      image_width: 1672
      image_height: 941

- id: ai-for-sustainable-development
  title: AI for Sustainable Development
  accent: "#1E7C70"
  framing: Scientific knowledge and human expertise for environmental understanding
  introduction: >-
    I develop AI systems that integrate physical processes, scientific
    knowledge, and human expertise to advance environmental understanding,
    prediction, and decision-making.
  topics:
    - id: ai-geography
      level: Geographic research
      title: Human–AI Collaboration for Geographic Research
      paragraphs:
        - >-
          How can domain experts collaborate naturally with AI throughout
          geographic research? I work on interactive systems that let
          researchers express knowledge, steer analysis, correct model
          outputs, and evaluate results as part of their everyday workflows.
          Dune interpretation provides a foundation for studying these
          collaboration mechanisms in practice.
        - >-
          I am developing a continuous learning loop in which expert
          interactions produce feedback and reusable knowledge that can
          improve models, while improved models support more effective
          collaboration. This agenda considers how AI systems evolve over
          long-term use and adapt to new geographic settings, data, and
          scientific questions.
      image: /assets/images/research-roadmaps/ai-for-geography-v2.png
      image_alt: >-
        Research roadmap from dune observations and geographic knowledge to
        interactive interpretation, expert validation, and field applications.
      image_width: 1672
      image_height: 941
    - id: ai-ocean-science
      level: Ocean science
      title: Physics–AI Ocean Forecasting and Early Warning
      paragraphs:
        - >-
          How can AI provide earlier and more reliable warning of ocean
          extremes? I integrate physical ocean dynamics with data-driven
          learning to model changing ocean conditions. Building on ocean
          temperature forecasting, I study how scientific constraints and
          observations can improve the reliability and interpretability of
          predictions.
        - >-
          My longer-term goal is to move toward forecasting extreme events
          across multiple processes and scales, including their onset,
          intensity, duration, and spatial extent. This research connects
          physical modeling with operational needs, aiming to support timely
          warning and informed responses to environmental risks.
      image: /assets/images/research-roadmaps/ai-for-ocean-science-v2.png
      image_alt: >-
        Research roadmap combining ocean observations, physical processes,
        and AI for forecasting and early warning of ocean extremes.
      image_width: 1672
      image_height: 941
