- id: llm-values-ai-orientalism
  title: Geopolitical Bias and Pluralistic AI
  accent: "#D84C19"
  image: /assets/images/research-roadmaps/geopolitical-bias-pluralistic-ai-v3.png
  image_alt: >-
    Research roadmap comparing human and LLM value landscapes across societies
    to identify geopolitical bias and support pluralistic AI.
  image_width: 1672
  image_height: 941
  paragraphs:
    - >-
      Large language models increasingly generate content and make judgments
      across cultural and geopolitical contexts, yet they may not represent the
      values of all societies with equal fidelity. My research compares
      LLM-generated value profiles with empirical data on human values to examine
      whose values models reproduce, which societies they simplify or
      misrepresent, and whether dominant geopolitical perspectives appear as
      systematic distortions.
    - >-
      I study bias as a global representational structure rather than a set of
      isolated wrong answers. My work maps which societies models portray as
      more similar, more different, or more homogeneous than human data
      suggests. We characterize one such pattern as AI Orientalism, extending
      Said's theoretical lens to the asymmetric representations produced by
      contemporary generative AI.
    - >-
      Going forward, I will test whether these patterns persist across
      languages, models, social scenarios, and multimodal generation, and
      examine their relationship to training-data coverage and provenance.
      This work contributes to a broader vision of pluralistic AI: systems that
      can recognize diverse, sometimes conflicting value systems without
      reducing them to a single dominant cultural perspective.
  related_publication_ids:
    - value-atlas-ai

- id: ai-geography
  title: AI for Geography
  accent: "#378ADD"
  image: /assets/images/research-roadmaps/ai-for-geography-v2.png
  image_alt: >-
    Research roadmap from dune imagery and expert interpretation to
    dune-specific AI, interactive refinement, and field deployment.
  image_width: 1672
  image_height: 941
  paragraphs:
    - >-
      Geographic research often depends on expert interpretation of complex
      visual evidence, but manual workflows are slow and difficult to scale. My
      research asks how AI can support the full path from a geographic question
      to field use. I use dune interpretation as a demanding testbed for
      developing methods that combine domain knowledge, machine learning, and
      expert judgment.
    - >-
      My work advances this workflow in stages: deep vision models embedded
      in familiar GIS software; foundation models adapted with dune-specific
      knowledge; interactive systems that let geographers correct ambiguous
      boundaries; and tangible, multi-prompt interfaces for collaborative work
      on mobile devices. Across these stages, I evaluate scientific utility and
      integration with expert practice rather than segmentation accuracy alone.
    - >-
      The next stage is cloud–edge–device collaboration for field deployment. I
      aim to distribute training, inference, interaction, and data
      synchronization across cloud services, edge nodes, and portable devices,
      while using field observations and expert feedback to improve models
      continuously. The longer-term goal is a reusable AI-supported workflow
      for geographic interpretation, validation, collaboration, and deployment.
  related_publication_ids:
    - fengepad
    - dcv2i-ai-magazine
    - dunesa
    - fenge
    - dcv2i-iaai

- id: ai-ocean-science
  title: AI for Ocean Science
  accent: "#1E8A7A"
  image: /assets/images/research-roadmaps/ai-for-ocean-science-v2.png
  image_alt: >-
    Research roadmap combining ocean observations and physical processes with
    AI for sea-surface-temperature prediction and early warning of extremes.
  image_width: 1672
  image_height: 941
  paragraphs:
    - >-
      Ocean extremes can develop rapidly and have substantial ecological and
      societal consequences, making reliable early warning essential. My
      research asks how artificial intelligence can improve the prediction of
      ocean conditions and provide useful lead time before extreme events occur.
    - >-
      I develop ocean forecasting models that combine data-driven learning with
      physical processes governing ocean evolution. My current work
      incorporates processes such as advection, diffusion, and air–sea heat
      exchange into neural dynamical models for sea surface temperature
      prediction. This approach aims to produce forecasts informed by both
      observations and ocean dynamics.
    - >-
      My longer-term goal is to move from predicting individual ocean variables
      to forecasting extreme events as evolving physical processes. I am
      particularly interested in predicting their onset, intensity, duration,
      and spatial extent by combining physical constraints, multi-source
      observations, and adaptive learning. The ultimate goal is to build
      physics–AI forecasting systems that support earlier and more reliable
      warning of ocean extremes.
  related_publication_ids:
    - ocean-heat-extremes-warning
    - sstode
    - ocean-parameters-review
