- id: human-ai-decision-making
  title: Human–AI Decision-Making in Social Systems
  accent: "#7F77DD"
  paragraphs:
    - >-
      My primary research examines how social signals influence human and AI
      decision-making, especially when the underlying information is difficult
      to verify. I am particularly interested in signals that make previously
      unobservable activities visible, such as contribution summaries,
      behavioral traces, or other platform-generated indicators used to
      evaluate people. A central finding from this line of work is that
      increasing visibility does not necessarily improve evaluation: signals
      can be ignored, misinterpreted, or used in ways that create unintended
      behavioral consequences.
    - >-
      Building on this, I study how humans and large language models interpret
      the same social signals. In unverifiable decision settings, where there
      is no immediate ground truth for whether a decision is “correct,” humans
      and LLMs may rely on different cues, weigh information differently, and
      exhibit different forms of bias. My current work focuses on identifying
      these differences and understanding which properties of a signal make it
      informative, misleading, or robust across decision-makers. The next step
      is to move from analyzing existing signals to designing new ones. I aim
      to develop and experimentally evaluate signals that improve decision
      quality for both humans and AI, with particular attention to how
      information should be selected, summarized, and presented in mixed
      human–AI decision environments.
  related_publication_ids:
