abstract: Large language models (LLMs) increasingly serve as critical information
  infrastructures for global development and policy decisions. However, whether rapid
  advances in LLMs have reduced or reinforced geographic disparities in factual recall
  remains unclear. We conduct a longitudinal assessment by updating WorldBench through
  2025 across 11 development indicators and 216 countries and territories, systematically
  evaluating an extensive suite of 33 earlier and recent LLMs across over 140K queries.
  We find that while recent LLMs reduce global mean error by 41.0%, geographic disparities
  persist, with errors remaining 1.58× as high in Sub-Saharan Africa as in North America
  and 1.27× as high in low-income as in high-income nations. Furthermore, open-source
  LLMs achieve substantial improvements yet their regional disparities remain largely
  unchanged, while proprietary LLMs exhibit lower errors and smaller geographic gaps.
  Such improvements are also uneven across development indicators, with marked gains
  in population and GDP but persistent stalls in critical welfare indicators such
  as maternal mortality and education expenditure. Enabling external retrieval serves
  as an effective path toward narrowing these gaps. Our findings reveal a persistent
  disconnect between advances in LLM factual accuracy and progress toward more geographically
  equitable access to socioeconomic knowledge.
