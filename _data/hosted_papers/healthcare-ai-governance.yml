abstract: The integration of artificial intelligence (AI) into global healthcare workflows
  is advancing faster than state governance systems can adapt around the world. This
  Health Policy paper shifts beyond the traditional Global North versus Global South
  binary, providing a comparative regulatory analysis of a landscape divided between
  dominant technology-exporting superpowers (the United States, the European Union,
  and China) and technology-importing regions (the African continent). While exporting
  powers demonstrate principled convergence on safety, lifecycle management, and human
  oversight, their underlying legal architectures introduce severe operational fragmentation.
  For technology-importing regions, this fragmentation creates systemic vulnerabilities,
  exposing local populations to regulatory arbitrage and asymmetric dependencies on
  foreign cloud infrastructure. This operational friction has triggered an emergent
  narrative of Sovereign AI, wherein developing nations prioritize data sovereignty
  and localized compute infrastructure to guarantee algorithmic alignment with regional
  clinical realities. Ultimately, mitigating global health disparities requires reconciling
  fragmented state legal regimes with the normative ethical frameworks championed
  by intergovernmental and non-governmental institutions, shifting toward a unified,
  human-centered global regulatory science.
