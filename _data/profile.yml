bio:
  - >-
    Hi there! I am currently a Ph.D. at the
    <a href="https://ai.bupt.edu.cn/" target="_blank" rel="noopener noreferrer">School of Artificial Intelligence</a>,
    <a href="https://www.bupt.edu.cn/" target="_blank" rel="noopener noreferrer">Beijing University of Posts and Telecommunications (BUPT)</a>,
    advised by Wei Wang and co-supervised by Yi Wang.
  - >-
    My research interests include <strong>social computing, human-AI
    decision-making, and AI for science</strong>. I study how people and AI
    make decisions from social signals, how large language models represent
    human values, and how physics- and domain-informed AI can support
    geography and ocean science.
contact_note: >-
